<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>Pre-Fire Plan: Site Plan</title>
<link rel="stylesheet" href="styles-preplan.css">
<script src="preplan-storage.js"></script>
<script src="preplan-cloud.js"></script>
<script src="preplan-iso.js"></script>
<script src="preplan-reset.js"></script>
<script src="preplan-flow.js"></script>
<script src="preplan-layout.js"></script>
<script src="preplan-sitemap.js"></script>
<style>
#legacySite{margin-top:18px;border:1px solid var(--slate-300);border-radius:var(--radius-md);padding:12px;background:var(--slate-50)}
#legacySite img{max-width:240px;border-radius:6px;border:1px solid var(--slate-300);display:block;margin:8px 0}
</style>
  <link rel="stylesheet" href="preplan-layout.css">
</head>
<body>
<div class="page-wrapper">
    <div class="container">
        <header class="report-header">
            <div class="header-top">
                <img src="images/cfd-logo.png" alt="Centerville Fire Department" class="patch-logo">
                <div class="header-text"><h1>Centerville Fire Department</h1><h2>Pre-Fire Plan Data Sheet</h2></div>
            </div>
        </header>
        <div class="progress-indicator">Page 10 of 12: Site Plan</div>
        <div class="progress-bar-container"><div class="progress-bar" style="width:83.33%"></div></div>

        <!-- The site map builds itself in here. It replaced the upload-a-screenshot
             box: markers on a screengrab have no coordinates and cannot be checked
             against anything. -->
        <div id="siteMapHost"></div>

        <!-- Only shown when a plan still carries an aerial from the old page. -->
        <div id="legacySite" class="hidden">
            <div style="font-weight:700;color:var(--navy-blue)">Aerial from the old site plan page</div>
            <div style="font-size:0.85rem;color:var(--slate-500)">Kept so nothing is lost. The site map above is
                what the report uses now; this only prints if no site map has been made.</div>
            <img id="legacySiteImg" alt="Previous site plan">
            <button type="button" class="btn-secondary" onclick="dropLegacy()">Remove it</button>
        </div>

        <div class="nav-buttons">
            <button type="button" class="btn-secondary" onclick="leave('page9-hazardous-materials.html')">← Previous</button>
            <button type="button" class="btn-primary" onclick="leave('page11-floor-plan.html')">Next →</button>
        </div>
    </div>
</div>
<footer>
    <img src="images/city-logo.png" alt="City of Centerville" class="city-logo">
    <p>© 2026 City of Centerville Fire Department</p>
</footer>
<script>
// Leaving the page composes the map one last time, so what is on screen is what
// the report carries. It is async, so give it a moment before navigating.
function leave(href){
    try{
        if(window.PreplanSiteMap&&window.PreplanSiteMap.render){
            window.PreplanSiteMap.render().then(function(){location.href=href})
                .catch(function(){location.href=href});
            setTimeout(function(){location.href=href},2500);   // never trap anyone here
            return;
        }
    }catch(e){}
    location.href=href;
}
(function(){
    var d={};try{d=JSON.parse(localStorage.getItem('preFirePlan')||'{}')}catch(e){}
    if(d.site_plan_image){
        document.getElementById('legacySiteImg').src=d.site_plan_image;
        document.getElementById('legacySite').classList.remove('hidden');
    }
})();
function dropLegacy(){
    if(!confirm('Remove the old uploaded aerial from this plan?'))return;
    try{
        var d=JSON.parse(localStorage.getItem('preFirePlan')||'{}');
        delete d.site_plan_image; delete d.site_plan_data;
        localStorage.setItem('preFirePlan',JSON.stringify(d));
    }catch(e){}
    document.getElementById('legacySite').classList.add('hidden');
}
</script>
</body>
</html>
